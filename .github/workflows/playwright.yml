name: CI - Build, Test & UI Validation
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Build and Quality Checks
  build-and-quality:
    name: Build & Quality Checks
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Type checking
      run: pnpm run type-check
      continue-on-error: false
    
    - name: Build application
      run: pnpm run build
      continue-on-error: false
    
    - name: Cache build output
      uses: actions/cache@v4
      with:
        path: |
          .next
          out
        key: ${{ runner.os }}-build-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-build-

  # Job 2: UI Testing with Playwright
  ui-testing:
    name: UI & Visual Regression Testing
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: build-and-quality
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Restore build cache
      uses: actions/cache@v4
      with:
        path: |
          .next
          out
        key: ${{ runner.os }}-build-${{ github.sha }}
    
    - name: Install Playwright Browsers
      run: pnpm dlx playwright install --with-deps chromium
    
    - name: Run functional validation tests
      run: pnpm dlx playwright test package-upgrade-validation.spec.ts
      continue-on-error: false
    
    - name: Run UI snapshot tests
      run: pnpm dlx playwright test ui-snapshots.spec.ts
      continue-on-error: true # Allow snapshots to fail in CI but still run
    
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-test-results
        path: test-results/
        retention-days: 30

  # Job 3: Package Security Audit
  security-audit:
    name: Security Audit
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Run security audit
      run: pnpm audit --audit-level moderate
      continue-on-error: true # Don't fail on non-critical security issues

  # Job 4: Cross-browser Testing (Optional - runs only on main branch)
  cross-browser-testing:
    name: Cross-browser UI Testing
    timeout-minutes: 45
    runs-on: ubuntu-latest
    needs: [build-and-quality, ui-testing]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Install Playwright Browsers
      run: pnpm dlx playwright install --with-deps ${{ matrix.browser }}
    
    - name: Run cross-browser tests
      run: pnpm dlx playwright test package-upgrade-validation.spec.ts --project=${{ matrix.browser }}
    
    - name: Upload cross-browser test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cross-browser-results-${{ matrix.browser }}
        path: test-results/
        retention-days: 14
